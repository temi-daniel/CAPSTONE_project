apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-app
  namespace: default
  labels:
    app: project-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-app
  template:
    metadata:
      labels:
        app: project-app
    spec:
      containers:
      - name: project-app
        image: 818005122467.dkr.ecr.us-east-1.amazonaws.com/execute-project-repo:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: db-credentials
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
